<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Manager - DOPA NASAN Score</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBPC8Wcv5InhI9O-2aMfvclF3fBtqSo1xo",
          authDomain: "dopa-nasan-score.firebaseapp.com",
          projectId: "dopa-nasan-score",
          storageBucket: "dopa-nasan-score.firebasestorage.app",
          messagingSenderId: "678813152611",
          appId: "1:678813152611:web:959239d16e296a16cc0f56"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const storage = firebase.storage();
        
        // กำหนดโฟลเดอร์หลักที่จะเข้ามาดู (โฟลเดอร์ที่เก็บหลักฐานทั้งหมด)
        const ROOT_PATH = "evidence"; 
        let currentPath = ROOT_PATH;

        window.onload = function() {
            auth.signInAnonymously().then(() => {
                document.getElementById('authStatus').innerHTML = '<i class="fa-solid fa-check-circle text-green-400"></i> เชื่อมต่อ Firebase สำเร็จ';
                loadFiles(currentPath);
            }).catch(err => {
                document.getElementById('authStatus').innerHTML = `<i class="fa-solid fa-times-circle text-red-400"></i> ล็อกอินล้มเหลว: ${err.message}`;
            });
        };

        async function loadFiles(path) {
            currentPath = path;
            renderBreadcrumb(path);
            
            const container = document.getElementById('fileContainer');
            container.innerHTML = '<div class="text-center p-10"><i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-500"></i><p class="mt-2 text-slate-500">กำลังดึงข้อมูล...</p></div>';
            
            const listRef = storage.ref(path);
            
            try {
                const res = await listRef.listAll();
                container.innerHTML = '';
                
                // หากโฟลเดอร์ว่างเปล่า
                if (res.prefixes.length === 0 && res.items.length === 0) {
                    container.innerHTML = '<div class="text-center p-10 text-slate-400 col-span-full">โฟลเดอร์นี้ว่างเปล่า</div>';
                    return;
                }

                // สร้างปุ่มโฟลเดอร์
                res.prefixes.forEach((folderRef) => {
                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:border-indigo-400 cursor-pointer transition" onclick="loadFiles('${folderRef.fullPath}')">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded-xl flex items-center justify-center text-lg"><i class="fa-solid fa-folder"></i></div>
                                <span class="font-bold text-slate-700">${folderRef.name}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-300"></i>
                        </div>
                    `;
                });

                // สร้างปุ่มไฟล์
                res.items.forEach((itemRef) => {
                    // ไอคอนไฟล์
                    let icon = '<i class="fa-regular fa-file text-slate-500"></i>';
                    let bg = 'bg-slate-50';
                    let ext = itemRef.name.split('.').pop().toLowerCase();
                    if(['jpg','jpeg','png','gif'].includes(ext)) { icon = '<i class="fa-regular fa-image text-blue-500"></i>'; bg = 'bg-blue-50'; }
                    else if(ext === 'pdf') { icon = '<i class="fa-regular fa-file-pdf text-red-500"></i>'; bg = 'bg-red-50'; }

                    // สร้างกรอบของไฟล์
                    let fileHTML = `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                            <div class="flex items-start gap-3 mb-3">
                                <div class="w-10 h-10 flex-none rounded-xl flex items-center justify-center text-lg ${bg}">${icon}</div>
                                <span class="text-xs font-medium text-slate-600 break-all line-clamp-2" title="${itemRef.name}">${itemRef.name}</span>
                            </div>
                            <div class="flex gap-2 mt-auto">
                                <button onclick="viewFile('${itemRef.fullPath}')" class="flex-1 bg-indigo-50 text-indigo-600 py-2 rounded-lg text-[10px] font-bold hover:bg-indigo-100 transition"><i class="fa-solid fa-eye"></i> ดูไฟล์</button>
                                <button onclick="deleteFile('${itemRef.fullPath}', '${itemRef.name}')" class="flex-none bg-red-50 text-red-600 px-3 py-2 rounded-lg text-[10px] font-bold hover:bg-red-100 transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += fileHTML;
                });

            } catch (error) {
                container.innerHTML = `<div class="text-center p-10 text-red-500 col-span-full"><i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i><br>โหลดข้อมูลไม่สำเร็จ (สิทธิ์การเข้าถึงอาจไม่ถูกต้อง)<br><span class="text-xs text-slate-400">${error.message}</span></div>`;
            }
        }

        function renderBreadcrumb(path) {
            const parts = path.split('/');
            let bcHTML = '';
            let currentBuild = '';
            
            parts.forEach((part, index) => {
                if(part === '') return;
                currentBuild += (currentBuild === '' ? '' : '/') + part;
                
                if (index === parts.length - 1) {
                    bcHTML += `<span class="text-slate-800 font-bold">${part}</span>`;
                } else {
                    bcHTML += `<span class="text-indigo-600 cursor-pointer hover:underline" onclick="loadFiles('${currentBuild}')">${part}</span> <span class="text-slate-400 mx-2">/</span> `;
                }
            });
            
            document.getElementById('breadcrumb').innerHTML = bcHTML;

            // ปุ่มกลับขึ้นไป 1 ระดับ
            if (path !== ROOT_PATH && path !== '') {
                const parentPath = parts.slice(0, -1).join('/');
                document.getElementById('upBtn').style.display = 'inline-flex';
                document.getElementById('upBtn').onclick = () => loadFiles(parentPath);
            } else {
                document.getElementById('upBtn').style.display = 'none';
            }
        }

        async function viewFile(fullPath) {
            try {
                const url = await storage.ref(fullPath).getDownloadURL();
                window.open(url, '_blank');
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเปิดไฟล์ได้: ' + error.message, 'error');
            }
        }

        function deleteFile(fullPath, fileName) {
            Swal.fire({
                title: 'ยืนยันการลบไฟล์?',
                text: `คุณกำลังจะลบไฟล์ "${fileName}" ถาวร ไม่สามารถกู้คืนได้`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'ใช่, ลบเลย'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'กำลังลบไฟล์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    try {
                        await storage.ref(fullPath).delete();
                        Swal.fire('สำเร็จ', 'ลบไฟล์เรียบร้อยแล้ว', 'success');
                        loadFiles(currentPath); // โหลดใหม่
                    } catch (error) {
                        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถลบไฟล์ได้: ' + error.message, 'error');
                    }
                }
            });
        }
    </script>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-3 md:p-4 flex justify-between items-center flex-none shadow-md">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-server text-2xl text-indigo-300"></i>
            <div>
                <h1 class="font-bold text-base md:text-lg leading-tight">Storage Manager</h1>
                <p id="authStatus" class="text-[10px] text-indigo-200">กำลังเชื่อมต่อ...</p>
            </div>
        </div>
        <button onclick="window.location.href='admin.html'" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm"><i class="fa-solid fa-arrow-left"></i> กลับหน้าระบบ</button>
    </header>

    <!-- Toolbar & Path -->
    <div class="bg-white border-b border-slate-200 p-3 flex items-center gap-3 flex-none shadow-sm z-10">
        <button id="upBtn" class="bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition hidden items-center gap-1"><i class="fa-solid fa-level-up-alt"></i> ย้อนกลับ</button>
        <div class="flex-grow text-xs bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 overflow-x-auto whitespace-nowrap custom-scroll" id="breadcrumb">
            <span class="text-slate-400">Loading...</span>
        </div>
        <button onclick="loadFiles(currentPath)" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold transition"><i class="fa-solid fa-rotate-right"></i> รีเฟรช</button>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow bg-slate-100 p-4 overflow-y-auto custom-scroll">
        <div class="container mx-auto max-w-5xl">
            <div id="fileContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- ไฟล์และโฟลเดอร์จะถูกสร้างที่นี่ -->
            </div>
        </div>
    </main>

</body>
</html>
