<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Sheets V26 - Searchable Data Retainer</title>
    
    <link rel="icon" href="DOPA_NASAN_Score_App_Icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="DOPA_NASAN_Score_App_Icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="DOPA_NASAN_Score_App_Icons/favicon-48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="DOPA_NASAN_Score_App_Icons/apple-touch-icon.png">
    <link rel="manifest" href="DOPA_NASAN_Score_App_Icons/manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, writeBatch, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBPC8Wcv5InhI9O-2aMfvclF3fBtqSo1xo",
          authDomain: "dopa-nasan-score.firebaseapp.com",
          projectId: "dopa-nasan-score",
          storageBucket: "dopa-nasan-score.firebasestorage.app",
          messagingSenderId: "678813152611",
          appId: "1:678813152611:web:959239d16e296a16cc0f56",
          measurementId: "G-4QN247NQTT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const basePath = `artifacts/dopa-nasan-score/public/data`;

        const schemas = {
            users_config: {
                docIdField: 'username',
                cols: [
                    { key: 'username', label: 'username' },
                    { key: 'password', label: 'password' },
                    { key: 'role', label: 'role' },
                    { key: 'filter', label: 'filter' },
                    { key: 'name', label: 'name' }
                ]
            },
            officials: {
                docIdField: 'idCard',
                cols: [
                    { key: 'idCard', label: 'เลข ปชช.' },
                    { key: 'fullName', label: 'ชื่อ-สกุล' },
                    { key: 'position', label: 'ตำแหน่ง' },
                    { key: 'moo', label: 'หมู่ที่ (เลข)' },
                    { key: 'rawVillage', label: 'ชื่อบ้าน' },
                    { key: 'village', label: 'หมู่บ้านเต็ม' },
                    { key: 'subdistrict', label: 'ตำบล' },
                    { key: 'totalScore', label: 'คะแนนรวม', isNumber: true }
                ]
            },
            score_logs: {
                docIdField: null,
                cols: [
                    { key: 'dateStr', label: 'วันที่ (Date)' },
                    { key: 'idCard', label: 'เลข ปชช.' },
                    { key: 'fullName', label: 'ชื่อ-สกุล' },
                    { key: 'categoryId', label: 'หมวด' },
                    { key: 'activityName', label: 'กิจกรรม' },
                    { key: 'score', label: 'คะแนน', isNumber: true },
                    { key: 'type', label: 'ประเภท (+/-)' },
                    { key: 'proofUrl', label: 'หลักฐาน' }
                ]
            },
            requests: {
                docIdField: 'ReqID',
                cols: [
                    { key: 'ReqID', label: 'ReqID' },
                    { key: 'Type', label: 'Type' },
                    { key: 'ID_Card', label: 'ID_Card' },
                    { key: 'FullName', label: 'FullName' },
                    { key: 'ActivityName', label: 'ActivityName' },
                    { key: 'RequestedScore', label: 'ReqScore', isNumber: true },
                    { key: 'StatusDistrict', label: 'Status' }
                ]
            }
        };

        let currentTable = 'users_config';
        let tableData = [];
        let isEditingMode = false;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await signInAnonymously(auth);
                document.getElementById('authStatus').innerHTML = '<i class="fa-solid fa-check text-green-400"></i> เชื่อมต่อสำเร็จ';
                fetchDataFromFirebase();
            } catch (err) {
                document.getElementById('authStatus').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> ล็อกอินไม่สำเร็จ`;
            }
        });

        window.switchTable = function() {
            currentTable = document.getElementById('tableSelector').value;
            // เคลียร์ช่องค้นหาเมื่อเปลี่ยนตาราง
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            fetchDataFromFirebase();
        }

        // ฟังก์ชันสำหรับเพิ่มแถวใหม่แบบแมนนวล
        window.addNewRow = function() {
            const schema = schemas[currentTable];
            let newRow = { _isDirty: true }; // กำหนดให้เป็นสถานะแก้ไข (สีเหลือง)
            
            // สร้าง properties ตาม schema เริ่มต้นด้วยค่าว่าง
            schema.cols.forEach(c => {
                newRow[c.key] = c.isNumber ? 0 : '';
            });

            // ดันแถวใหม่ไปไว้ข้างหน้าสุด (เพื่อให้เห็นชัดเจน)
            tableData.unshift(newRow);
            
            // แสดงปุ่มบันทึก
            isEditingMode = true; 
            document.getElementById('saveBtn').style.display = 'block'; 
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-save"></i> บันทึกการแก้ไข (Update)';
            
            // ล้างช่องค้นหาเพื่อให้เห็นแถวใหม่แน่นอน
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';

            renderTable();
        }

        window.fetchDataFromFirebase = async function() {
            Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            tableData = [];
            isEditingMode = true; 
            document.getElementById('saveBtn').style.display = 'block'; 
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-save"></i> บันทึกการแก้ไข (Update)';

            try {
                const querySnapshot = await getDocs(collection(db, `${basePath}/${currentTable}`));
                querySnapshot.forEach((document) => {
                    let data = document.data();
                    
                    if (currentTable === 'requests') {
                        data.ReqID = data.ReqID || data.reqId || document.id;
                        data.Type = data.Type || data.type || '';
                        data.ID_Card = data.ID_Card || data.idCard || data.officialId || '';
                        data.FullName = data.FullName || data.fullName || '';
                        data.ActivityName = data.ActivityName || data.activityName || '';
                        data.RequestedScore = data.RequestedScore || data.reqScore || data.requestedScore || 0;
                        data.StatusDistrict = data.StatusDistrict || data.statDist || data.statusDistrict || '';
                    }

                    let normalized = { ...data, _firebaseDocId: document.id, _isDirty: false };
                    tableData.push(normalized);
                });
                renderTable();
                Swal.close();
            } catch (err) {
                Swal.fire('ข้อผิดพลาด', err.message, 'error');
            }
        }

        window.renderTable = function() {
            const schema = schemas[currentTable];
            const thead = document.getElementById('tHead');
            const tbody = document.getElementById('tBody');
            
            // ดึงคำค้นหา
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const searchTerms = searchTerm.split(' ').filter(t => t !== '');
            
            let thHtml = '<tr><th class="w-12">No.</th>';
            schema.cols.forEach(c => { thHtml += `<th class="p-2">${c.label}</th>`; });
            thHtml += `<th class="w-16">ลบ</th></tr>`;
            thead.innerHTML = thHtml;

            let tbHtml = '';
            let filteredIndices = [];
            
            // กรองข้อมูลตามคำค้นหา
            for (let i = 0; i < tableData.length; i++) {
                let row = tableData[i];
                let isMatch = true;
                
                if (searchTerms.length > 0) {
                    for (let term of searchTerms) {
                        let termMatch = false;
                        // ค้นหาเฉพาะในคอลัมน์ที่มีใน Schema
                        for (let col of schema.cols) {
                            if (row[col.key] !== undefined && String(row[col.key]).toLowerCase().includes(term)) {
                                termMatch = true;
                                break;
                            }
                        }
                        if (!termMatch) {
                            isMatch = false;
                            break;
                        }
                    }
                }
                
                if (isMatch) filteredIndices.push(i);
            }

            // แสดงผลทั้งหมดที่กรองเจอ (ปลดล็อก 100 แถว)
            for(let i = 0; i < filteredIndices.length; i++) {
                let originalIndex = filteredIndices[i];
                let row = tableData[originalIndex];
                let trClass = row._isDirty ? 'bg-amber-50' : '';
                tbHtml += `<tr class="${trClass} transition-colors duration-300" id="tr-${originalIndex}"><td class="row-num">${i + 1}</td>`;
                
                schema.cols.forEach(c => {
                    let val = row[c.key] !== undefined ? row[c.key] : '';
                    let inputType = c.isNumber ? 'number' : 'text';
                    tbHtml += `<td class="p-1"><input type="${inputType}" step="any" class="sheet-input" value="${val}" onchange="updateCell(${originalIndex}, '${c.key}', this.value)"></td>`;
                });
                
                tbHtml += `<td class="text-center bg-slate-50"><button onclick="deleteRow(${originalIndex})" class="text-red-400 hover:text-red-600 px-3 py-2"><i class="fa-solid fa-trash"></i></button></td></tr>`;
            }

            if(filteredIndices.length === 0) {
                tbHtml += `<tr><td colspan="${schema.cols.length + 2}" class="text-center py-8 text-slate-500 font-bold bg-slate-50">ไม่พบข้อมูลที่ค้นหา</td></tr>`;
            }

            tbody.innerHTML = tbHtml;
            document.getElementById('recordCount').innerText = `แสดงผล: ${filteredIndices.length} / ทั้งหมด: ${tableData.length} แถว`;
        }

        window.updateCell = function(rowIndex, key, value) { 
            tableData[rowIndex][key] = value; 
            tableData[rowIndex]._isDirty = true;
            document.getElementById(`tr-${rowIndex}`).classList.add('bg-amber-50');
        }

        window.deleteRow = function(index) { 
            const row = tableData[index];
            if (row._firebaseDocId) {
                Swal.fire({ title: 'ยืนยันการลบ?', text: 'ลบออกจาก Firebase ทันที', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' }).then(async (r) => {
                    if(r.isConfirmed) {
                        await deleteDoc(doc(db, `${basePath}/${currentTable}`, row._firebaseDocId));
                        tableData.splice(index, 1); 
                        renderTable(); // รีเฟรชตารางและตัวกรอง
                        Swal.fire({icon: 'success', title: 'ลบแล้ว', timer: 1000, showConfirmButton: false});
                    }
                });
            } else {
                tableData.splice(index, 1); 
                renderTable(); 
            }
        }

        window.triggerExcelUpload = function() {
            document.getElementById('excelFileInput').click();
        }

        window.handleExcelUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            Swal.fire({ title: 'กำลังอ่านไฟล์ Excel...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                let targetSheetKeywords = [];
                if (currentTable === 'officials') targetSheetKeywords = ['bookkon', 'บุคลากร', 'official'];
                else if (currentTable === 'score_logs') targetSheetKeywords = ['score', 'log', 'ประวัติ'];
                else if (currentTable === 'users_config') targetSheetKeywords = ['user', 'config', 'ผู้ดูแล'];
                else if (currentTable === 'requests') targetSheetKeywords = ['request', 'appeal', 'คำร้อง'];

                let sheetMatch = null;
                for (let sheetName of workbook.SheetNames) {
                    let sNameLower = sheetName.toLowerCase().replace(/\s/g, '');
                    for (let keyword of targetSheetKeywords) {
                        if (sNameLower.includes(keyword)) { sheetMatch = sheetName; break; }
                    }
                    if (sheetMatch) break;
                }
                
                if (!sheetMatch) {
                    Swal.fire({ title: 'หาชีตไม่เจอ!', html: `ระบบหาชีตสำหรับ <b>${currentTable}</b> ไม่เจอครับ`, icon: 'error' });
                    document.getElementById('excelFileInput').value = '';
                    return;
                }

                const sheet = workbook.Sheets[sheetMatch];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                
                tableData = []; 
                isEditingMode = false; 
                document.getElementById('saveBtn').style.display = 'block'; 
                document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> บันทึกไฟล์ใหม่ขึ้น Firebase';
                let added = 0;
                
                jsonData.forEach(row => {
                    let newObj = {};
                    
                    if (currentTable === 'officials') {
                        let idKey = Object.keys(row).find(k => k.includes('เลขประจำตัว') || k.includes('ID'));
                        let nameKey = Object.keys(row).find(k => k.includes('ชื่อ'));
                        
                        if (!idKey || !row[idKey]) return;
                        
                        let idc = String(row[idKey]).replace(/\D/g, '');
                        let fn = String(row[nameKey] || 'ไม่ระบุชื่อ');
                        let pos = String(row['ตำแหน่ง'] || '-');
                        let moo = String(row['หมู่ที่'] || '');
                        let rv = String(row['ชื่อบ้าน'] || '');
                        let sub = String(row['ตำบล'] || '-');
                        let vil = (moo && rv) ? `หมู่ที่ ${moo} ${rv}` : '';
                        let ts = parseFloat(row['คะแนนรวม']) || 0;

                        newObj.idCard = idc; newObj.ID_Card = idc;
                        newObj.fullName = fn; newObj.FullName = fn;
                        newObj.position = pos; newObj.Position = pos;
                        newObj.moo = moo; newObj.Moo = moo;
                        newObj.rawVillage = rv; newObj.RawVillage = rv;
                        newObj.subdistrict = sub; newObj.Subdistrict = sub;
                        newObj.village = vil; newObj.Village = vil;
                        newObj.totalScore = ts; newObj.TotalScore = ts;
                        added++;
                    } 
                    else if (currentTable === 'score_logs') {
                        let idKey = Object.keys(row).find(k => k.includes('ID_Card') || k.includes('เลขประจำตัว'));
                        if (!idKey || !row[idKey]) return;
                        
                        let dateVal = row['Date'] || row['วันที่'] || row['Timestamp'] || '';
                        let dStr = '';
                        if (typeof dateVal === 'number') {
                            const dateObj = new Date(Math.round((dateVal - 25569) * 86400 * 1000));
                            dStr = dateObj.toISOString().split('T')[0];
                        } else if (dateVal) {
                            dStr = String(dateVal).split(' ')[0];
                        } else {
                            dStr = new Date().toISOString().split('T')[0]; 
                        }
                        
                        let tStamp = String(row['Timestamp'] || row['Date'] || dStr);
                        let idc = String(row[idKey]).replace(/\D/g, '');
                        let fn = String(row['FullName'] || row['ชื่อ-สกุล'] || 'ไม่ระบุชื่อ');
                        let cat = String(row['Category'] || row['หมวดหมู่'] || '0').trim(); 
                        let act = String(row['ActivityName'] || row['ชื่อกิจกรรม'] || 'ไม่ระบุกิจกรรม').trim();
                        let actd = String(row['ActivityDetail'] || '').trim();
                        let sc = parseFloat(row['Score'] || row['คะแนน']) || 0;
                        let ty = String(row['Type'] || row['ประเภท'] || 'positive').trim();
                        let rb = String(row['RecordedBy'] || row['ผู้บันทึก'] || 'System').trim();
                        let pr = String(row['ProofLink'] || row['หลักฐาน'] || row['proofUrl'] || '').trim();

                        newObj.dateStr = dStr; newObj.Date = dStr; newObj.date = dStr;
                        newObj.Timestamp = tStamp; newObj.timestamp = tStamp;
                        newObj.idCard = idc; newObj.ID_Card = idc;
                        newObj.fullName = fn; newObj.FullName = fn;
                        newObj.categoryId = cat; newObj.Category = cat; newObj.category = cat;
                        newObj.activityName = act; newObj.ActivityName = act;
                        newObj.activityDetail = actd; newObj.ActivityDetail = actd;
                        newObj.score = sc; newObj.Score = sc;
                        newObj.type = ty; newObj.Type = ty;
                        newObj.recordedBy = rb; newObj.RecordedBy = rb;
                        newObj.proofUrl = pr; newObj.ProofLink = pr; 
                        added++;
                    }
                    else if (currentTable === 'users_config') {
                        let userKey = Object.keys(row).find(k => k.toLowerCase().includes('user'));
                        if (!userKey || !row[userKey]) return;
                        
                        let passKey = Object.keys(row).find(k => k.toLowerCase().includes('pass'));
                        let roleKey = Object.keys(row).find(k => k.toLowerCase().includes('role'));
                        let filterKey = Object.keys(row).find(k => k.toLowerCase().includes('filter'));
                        let nameKey = Object.keys(row).find(k => k.toLowerCase().includes('name') && !k.toLowerCase().includes('user'));
                        
                        let u = String(row[userKey] || '').trim();
                        let p = String(row[passKey] || '').trim();
                        let r = String(row[roleKey] || 'tambon').trim();
                        let f = String(row[filterKey] || 'all').trim();
                        let n = String(row[nameKey] || 'ไม่ระบุชื่อ').trim();

                        newObj.username = u; newObj.Username = u;
                        newObj.password = p; newObj.Password = p;
                        newObj.role = r; newObj.Role = r;
                        newObj.filter = f; newObj.Filter = f;
                        newObj.name = n; newObj.DisplayName = n;
                        added++;
                    }
                    else if (currentTable === 'requests') {
                        let idKey = Object.keys(row).find(k => k.toLowerCase().includes('req'));
                        if (!idKey || !row[idKey]) return;
                        
                        let reqId = String(row[idKey]);
                        let ts = String(row['Timestamp'] || '');
                        let ty = String(row['Type'] || 'REQUEST');
                        let idc = String(row['ID_Card'] || '').replace(/\D/g, '');
                        let fn = String(row['FullName'] || 'ไม่ระบุชื่อ');
                        let cat = String(row['Category'] || '0');
                        let act = String(row['ActivityName'] || 'ไม่ระบุกิจกรรม');
                        let reqs = parseFloat(row['RequestedScore']) || 0;
                        let st = String(row['StatusTambon'] || 'Pending');
                        let sd = String(row['StatusDistrict'] || 'Pending');
                        let pr = String(row['ProofLink'] || row['หลักฐาน'] || row['proofUrl'] || '').trim();

                        newObj.ReqID = reqId; newObj.reqId = reqId;
                        newObj.Timestamp = ts; newObj.timestamp = ts;
                        newObj.Type = ty; newObj.type = ty;
                        newObj.ID_Card = idc; newObj.idCard = idc;
                        newObj.FullName = fn; newObj.fullName = fn;
                        newObj.Category = cat; newObj.category = cat;
                        newObj.ActivityName = act; newObj.activityName = act;
                        newObj.RequestedScore = reqs; newObj.requestedScore = reqs;
                        newObj.StatusTambon = st; newObj.statusTambon = st;
                        newObj.StatusDistrict = sd; newObj.statusDistrict = sd;
                        newObj.ProofLink = pr; newObj.proofUrl = pr;
                        added++;
                    }

                    if (Object.keys(newObj).length > 0) {
                        tableData.push(newObj);
                    }
                });

                // เคลียร์คำค้นหาหลังจากอัปโหลดไฟล์ใหม่
                const searchInput = document.getElementById('searchInput');
                if (searchInput) searchInput.value = '';
                
                renderTable();
                Swal.fire('สำเร็จ', `อ่านข้อมูลจากชีต "${sheetMatch}" ได้ ${added} รายการ\nกรุณากด "บันทึกไฟล์ใหม่" ด้านขวาบน`, 'success');
                document.getElementById('excelFileInput').value = '';
            };
            
            reader.readAsArrayBuffer(file);
        }

        window.clearOldData = async function() {
            const result = await Swal.fire({
                title: 'ยืนยันการล้างข้อมูลเก่า?',
                text: `ต้องการลบข้อมูลทั้งหมดในตาราง ${currentTable} ใช่หรือไม่?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444'
            });

            if (!result.isConfirmed) return;

            Swal.fire({ title: 'กำลังล้างข้อมูลเก่า...', html: 'กรุณารอสักครู่ (ห้ามปิดหน้าจอ)', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            try {
                const querySnapshot = await getDocs(collection(db, `${basePath}/${currentTable}`));
                const docs = [];
                querySnapshot.forEach((docSnap) => docs.push(docSnap.ref));

                const chunkSize = 450;
                for (let i = 0; i < docs.length; i += chunkSize) {
                    const chunk = docs.slice(i, i + chunkSize);
                    const batch = writeBatch(db);
                    chunk.forEach(ref => batch.delete(ref));
                    await batch.commit();
                }

                tableData = [];
                renderTable();
                Swal.fire('สำเร็จ', `ล้างข้อมูลเก่าจำนวน ${docs.length} รายการ เรียบร้อยแล้ว`, 'success');
            } catch (err) {
                Swal.fire('ข้อผิดพลาด', err.message, 'error');
            }
        }

        window.saveToFirebase = async function() {
            if (tableData.length === 0) return Swal.fire('เตือน', 'ไม่มีข้อมูลให้บันทึก', 'warning');

            const result = await Swal.fire({
                title: isEditingMode ? 'ยืนยันการอัปเดตข้อมูล?' : 'ยืนยันการบันทึกใหม่?',
                text: `กำลังบันทึกข้อมูลตาราง ${currentTable} จำนวน ${tableData.length} แถว\n(ระบบจะทยอยบันทึกทีละส่วนอัตโนมัติ)`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#10b981'
            });

            if (!result.isConfirmed) return;

            Swal.fire({
                title: 'กำลังบันทึกข้อมูล...',
                html: 'บันทึกไปแล้ว <b>0</b> แถว (ห้ามปิดหน้าจอ)',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const schema = schemas[currentTable];
            try {
                const chunkSize = 450;
                let processedCount = 0;

                for (let i = 0; i < tableData.length; i += chunkSize) {
                    const chunk = tableData.slice(i, i + chunkSize);
                    const batch = writeBatch(db);
                    
                    chunk.forEach((row, j) => {
                        let docId = schema.docIdField ? row[schema.docIdField] : row._firebaseDocId;
                        if (!docId) docId = 'ID-' + Date.now() + '-' + (i+j);
                        const ref = doc(db, `${basePath}/${currentTable}`, String(docId));
                        
                        let cleanRow = { ...row };
                        delete cleanRow._firebaseDocId;
                        delete cleanRow._isDirty;
                        
                        // บังคับให้คอลัมน์ที่เป็นตัวเลขเป็น Number จริงๆ ก่อนบันทึก
                        schema.cols.forEach(c => {
                            if(c.isNumber && cleanRow[c.key] !== undefined && cleanRow[c.key] !== "") {
                                cleanRow[c.key] = Number(cleanRow[c.key]) || 0;
                            }
                        });

                        if (isEditingMode) {
                            if (row._isDirty) batch.set(ref, cleanRow, { merge: true });
                        } else {
                            batch.set(ref, cleanRow);
                        }
                    });

                    await batch.commit();
                    processedCount += chunk.length;
                    Swal.update({ html: `บันทึกไปแล้ว <b>${processedCount}</b> จาก ${tableData.length} แถว (ห้ามปิดหน้าจอ)` });
                }

                Swal.fire('สำเร็จ', `บันทึกข้อมูล ${tableData.length} รายการ ขึ้น Firebase เรียบร้อยแล้ว!`, 'success').then(() => {
                    fetchDataFromFirebase(); // โหลดใหม่เพื่ออัปเดต ID
                });
            } catch (err) {
                Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
            }
        }
    </script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        .sheet-table { border-collapse: collapse; width: 100%; background: white; min-width: 800px; }
        .sheet-table th { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 10px; font-size: 13px; font-weight: bold; text-align: center; color: #475569; position: sticky; top: 0; z-index: 10; }
        .sheet-table td { border: 1px solid #cbd5e1; padding: 4px; position: relative; }
        .sheet-input { width: 100%; min-height: 36px; border: 1px solid transparent; padding: 6px 10px; font-size: 13px; outline: none; background: transparent; border-radius: 4px; }
        .sheet-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2); background: #ffffff; }
        .row-num { background: #f8fafc; text-align: center; font-size: 12px; color: #94a3b8; width: 50px; font-weight: bold; user-select: none; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="bg-indigo-700 text-white p-3 flex justify-between items-center flex-none shadow-md">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-database text-2xl text-emerald-400"></i>
            <div>
                <h1 class="font-bold text-lg leading-tight">Firebase Data Editor (V26)</h1>
                <p id="authStatus" class="text-[10px] text-indigo-200">กำลังเชื่อมต่อ...</p>
            </div>
        </div>
        <button onclick="window.location.href='index.html'" class="bg-indigo-800 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-house"></i> หน้าหลัก</button>
    </header>

    <div class="bg-white border-b border-slate-200 p-2 flex gap-2 flex-none items-center shadow-sm overflow-x-auto">
        <select id="tableSelector" onchange="switchTable()" class="bg-slate-50 border border-slate-300 text-sm rounded-lg p-2 font-bold outline-none cursor-pointer">
            <option value="users_config">⚙️ ผู้ดูแลระบบ (users_config)</option>
            <option value="officials">👥 บุคลากร (officials)</option>
            <option value="score_logs">⭐ ประวัติคะแนน (score_logs)</option>
            <option value="requests">📝 คำร้องอุทธรณ์ (requests)</option>
        </select>
        
        <button onclick="clearOldData()" class="bg-red-50 text-red-600 px-3 py-2 rounded-lg text-xs font-bold border border-red-200 hover:bg-red-100"><i class="fa-solid fa-trash-can"></i> ล้างข้อมูลเก่าก่อน</button>
        <button onclick="fetchDataFromFirebase()" class="bg-blue-50 text-blue-600 px-3 py-2 rounded-lg text-xs font-bold border border-blue-200 hover:bg-blue-100"><i class="fa-solid fa-rotate"></i> โหลดข้อมูลมาแก้ไข</button>

        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">
        <button onclick="triggerExcelUpload()" class="bg-emerald-100 text-emerald-800 px-3 py-2 rounded-lg text-xs font-bold border border-emerald-300 hover:bg-emerald-200"><i class="fa-solid fa-file-excel"></i> นำเข้าไฟล์ Excel ใหม่</button>

        <!-- ปุ่มเพิ่มแถวใหม่ -->
        <button onclick="addNewRow()" class="bg-purple-100 text-purple-800 px-3 py-2 rounded-lg text-xs font-bold border border-purple-300 hover:bg-purple-200 ml-2 shadow-sm"><i class="fa-solid fa-plus"></i> เพิ่มแถวใหม่</button>

        <!-- กล่องค้นหา (Search Box) -->
        <div class="relative w-64 ml-2 border-l pl-4 hidden md:block">
            <i class="fa-solid fa-search absolute left-7 top-2.5 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" oninput="renderTable()" class="w-full pl-8 p-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none bg-slate-50" placeholder="พิมพ์คำค้นหา (ค้นได้ทุกคอลัมน์)...">
        </div>

        <div class="flex-grow"></div>
        <button id="saveBtn" style="display:none;" onclick="saveToFirebase()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md"><i class="fa-solid fa-cloud-arrow-up"></i> บันทึกขึ้น Firebase</button>
    </div>
    
    <!-- กล่องค้นหาสำหรับมือถือ -->
    <div class="p-2 bg-slate-50 border-b border-slate-200 md:hidden flex-none">
         <div class="relative w-full">
            <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 text-sm"></i>
            <input type="text" id="searchInputMobile" oninput="document.getElementById('searchInput').value=this.value; renderTable();" class="w-full pl-8 p-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none bg-white shadow-sm" placeholder="พิมพ์คำค้นหา (ตำบล, ชื่อ, หมู่)...">
        </div>
    </div>

    <main class="flex-grow overflow-auto bg-slate-100 custom-scroll relative" id="tableWrapper">
        <table class="sheet-table" id="mainTable">
            <thead id="tHead"></thead>
            <tbody id="tBody"></tbody>
        </table>
    </main>

    <footer class="bg-slate-800 text-slate-300 p-1.5 text-[10px] flex justify-between flex-none">
        <span id="recordCount">จำนวน: 0 แถว</span>
    </footer>

</body>
</html>
